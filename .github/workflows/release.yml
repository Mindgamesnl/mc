name: Build and Upload Release Assets

on:
  release:
    types: [created]

env:
  BINARY_NAME: mc
  GO_VERSION: '1.25.x'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-w -s -X main.Version=${{ steps.get_version.outputs.version }}" -o ${{ env.BINARY_NAME }}-${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.suffix }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.suffix }}

  upload-assets:
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Clean artifacts directory
        run: rm -rf ./artifacts

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Move artifacts to release directory
        run: |
          mkdir -p release
          find ./artifacts -type f -name "${{ env.BINARY_NAME }}-*" -exec cp {} ./release/ \;
          ls -la ./release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          ls -la

      - name: Upload assets to existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload all binaries and checksums to the existing release
          gh release upload ${{ github.event.release.tag_name }} ./release/* --clobber

      - name: Update release notes with checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          CURRENT_NOTES=$(gh release view "$TAG" --json body --jq '.body')

          # Nothing to do if a previous run already appended this section.
          if echo "$CURRENT_NOTES" | grep -q "### Installation"; then
            echo "Release notes already contain installation instructions."
            exit 0
          fi

          BASE="https://github.com/$REPO/releases/download/$TAG"

          # The heredoc is quoted so the markdown backticks are taken
          # literally; the checksums are appended afterwards instead of being
          # substituted inside it.
          {
            printf '%s\n' "$CURRENT_NOTES"
            cat << 'EOF'

          ### Installation

          **Linux/macOS (one-liner):**
          ```bash
          curl -sfL BASE_URL/mc-linux-amd64 -o mc && chmod +x mc && sudo mv mc /usr/local/bin/
          ```

          **Windows (PowerShell):**
          ```powershell
          Invoke-WebRequest -Uri "BASE_URL/mc-windows-amd64.exe" -OutFile "mc.exe"
          ```

          ### Manual Downloads
          - **Linux (x64):** [mc-linux-amd64](BASE_URL/mc-linux-amd64)
          - **Linux (ARM64):** [mc-linux-arm64](BASE_URL/mc-linux-arm64)
          - **Windows (x64):** [mc-windows-amd64.exe](BASE_URL/mc-windows-amd64.exe)
          - **macOS (Intel):** [mc-darwin-amd64](BASE_URL/mc-darwin-amd64)
          - **macOS (Apple Silicon):** [mc-darwin-arm64](BASE_URL/mc-darwin-arm64)

          ## Checksums (SHA256)
          ```
          EOF
            cat release/checksums.txt
            printf '```\n'
          } | sed "s|BASE_URL|$BASE|g" > combined_notes.md

          gh release edit "$TAG" --notes-file combined_notes.md
