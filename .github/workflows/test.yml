name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.25.x'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  test-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build for multiple platforms
      run: |
        set -e
        for platform in linux-amd64 linux-arm64 windows-amd64.exe darwin-amd64 darwin-arm64; do
          goos=${platform%%-*}
          rest=${platform#*-}
          goarch=${rest%.exe}
          GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -o "mc-$platform"
        done
        file mc-*

    - name: Smoke-test the native binary
      run: |
        ./mc-linux-amd64 --version
        ./mc-linux-amd64 --help

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build
      run: go build -o mc

    - name: Test Java validation
      run: ./mc test

    - name: List versions from the PaperMC API
      run: |
        # Exercises the live fill.papermc.io v3 API; v2 was retired (HTTP 410).
        ./mc versions | tee versions.txt
        grep -q "Available Paper versions" versions.txt

    - name: Reject an unpublished version
      run: |
        mkdir -p unknown-version && cd unknown-version
        if ../mc 99.99.99 < /dev/null; then
          echo "expected a failure for an unpublished version"
          exit 1
        fi
